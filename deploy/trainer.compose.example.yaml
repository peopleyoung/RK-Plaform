# Legacy static-token pull workers. New deployments should use deploy/nodes/trainer.
services:
  torch-trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.trainer-torch
      args:
        DEBIAN_MIRROR: http://deb.debian.org
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-trainer-torch-cpu:2026.08.26
    restart: unless-stopped
    environment:
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_WORKER_TOKEN: replace-with-legacy-worker-token
      RKNODE_WORKER_NAME: torch-trainer-01
      RKNODE_WORKER_KIND: trainer
      RKNODE_WORKER_ACCELERATOR: cpu
      RKNODE_WORKER_CAPABILITIES: yolo-detect,deeplabv3plus
      RKNODE_WORK_DIR: /data/jobs
      RKNODE_WORKSPACE_RECONCILE_SECONDS: "30"
    volumes:
      - trainer-data:/data

  paddle-trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.trainer-paddle
      args:
        DEBIAN_MIRROR: http://deb.debian.org
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-trainer-paddle-cpu:2026.08.26
    restart: unless-stopped
    environment:
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_WORKER_TOKEN: replace-with-legacy-worker-token
      RKNODE_WORKER_NAME: paddle-trainer-01
      RKNODE_WORKER_KIND: trainer
      RKNODE_WORKER_ACCELERATOR: cpu
      RKNODE_WORKER_CAPABILITIES: ppocr-det,ppocr-rec
      RKNODE_WORK_DIR: /data/jobs
      RKNODE_WORKSPACE_RECONCILE_SECONDS: "30"
    volumes:
      - trainer-data:/data

volumes:
  trainer-data:
