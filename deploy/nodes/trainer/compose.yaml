x-rknode-logging: &rknode-logging
  driver: json-file
  options:
    max-size: "${RKNODE_CONTAINER_LOG_MAX_SIZE:-20m}"
    max-file: "${RKNODE_CONTAINER_LOG_MAX_FILES:-3}"

services:
  trainer:
    build:
      context: ../../..
      dockerfile: ${RKNODE_TRAINER_DOCKERFILE:-deploy/Dockerfile.trainer-torch}
      args:
        BASE_IMAGE: ${RKNODE_TRAINER_BASE_IMAGE:-python:3.11-slim-bookworm}
        TORCH_INDEX_URL: ${RKNODE_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${RKNODE_TORCH_VERSION:-2.5.1+cpu}
        TORCHVISION_VERSION: ${RKNODE_TORCHVISION_VERSION:-0.20.1+cpu}
        PADDLE_PACKAGE: ${RKNODE_PADDLE_PACKAGE:-paddlepaddle==3.2.2}
        PYTHON_INDEX_URL: ${RKNODE_PYTHON_INDEX_URL:-https://pypi.org/simple}
    image: ${RKNODE_TRAINER_IMAGE:-rknode-trainer-torch-cpu:2026.08.20}
    entrypoint: []
    command: ["python", "-m", "workers.node_service.main"]
    restart: unless-stopped
    ports:
      - "${RKNODE_NODE_HOST_PORT:-10081}:10081"
    environment:
      RKNODE_NODE_TOKEN: ${RKNODE_NODE_TOKEN:-}
      RKNODE_NODE_TOKEN_FILE: ${RKNODE_NODE_TOKEN_FILE:-/data/state/node-token}
      RKNODE_NODE_NAME: ${RKNODE_NODE_NAME:-trainer-01}
      RKNODE_NODE_KIND: trainer
      RKNODE_NODE_ACCELERATOR: ${RKNODE_NODE_ACCELERATOR:-cpu}
      RKNODE_NODE_CAPABILITIES: ${RKNODE_NODE_CAPABILITIES:-yolo-detect,deeplabv3plus}
      RKNODE_NODE_MAX_CONCURRENCY: ${RKNODE_NODE_MAX_CONCURRENCY:-1}
      RKNODE_NODE_PORT: 10081
      RKNODE_NODE_WORK_DIR: /data/jobs
      RKNODE_API_URL: ${RKNODE_PLATFORM_URL:?set central platform URL}/api/v1
      RKNODE_WORKER_NAME: ${RKNODE_NODE_NAME:-trainer-01}
      RKNODE_WORKER_KIND: trainer
      RKNODE_WORKER_ACCELERATOR: ${RKNODE_NODE_ACCELERATOR:-cpu}
      RKNODE_WORKER_CAPABILITIES: ${RKNODE_NODE_CAPABILITIES:-yolo-detect,deeplabv3plus}
      RKNODE_WORKER_MAX_CONCURRENCY: ${RKNODE_NODE_MAX_CONCURRENCY:-1}
      RKNODE_WORK_DIR: /data/jobs
    volumes:
      - trainer-data:/data
    logging: *rknode-logging

volumes:
  trainer-data:
