# Default profile: Torch CPU trainer. Use a compose.* profile override for other runtimes.
x-rknode-logging: &rknode-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  trainer:
    build:
      context: ../../..
      dockerfile: deploy/Dockerfile.trainer-torch
      args:
        BASE_IMAGE: python:3.11-slim-bookworm
        DEBIAN_MIRROR: http://deb.debian.org
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        TORCH_VERSION: 2.5.1+cpu
        TORCHVISION_VERSION: 0.20.1+cpu
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-trainer-torch-cpu:2026.08.26
    entrypoint: []
    command: ["python", "-m", "workers.node_service.main"]
    restart: unless-stopped
    ports:
      - "10081:10081"
    environment:
      RKNODE_NODE_TOKEN: ""
      RKNODE_NODE_TOKEN_FILE: /data/state/node-token
      RKNODE_ENDPOINT_ID: service_0cf22ac464894472a75c21c3e20e9a48
      RKNODE_PLATFORM_URL: http://172.16.66.249:5173
      RKNODE_NODE_NAME: cpu-torch-trainer-01
      RKNODE_NODE_KIND: trainer
      RKNODE_NODE_ACCELERATOR: cpu
      RKNODE_NODE_CAPABILITIES: yolo-detect,deeplabv3plus
      RKNODE_NODE_MAX_CONCURRENCY: "1"
      RKNODE_NODE_PORT: "10081"
      RKNODE_NODE_WORK_DIR: /data/jobs
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_WORKER_NAME: cpu-torch-trainer-01
      RKNODE_WORKER_KIND: trainer
      RKNODE_WORKER_ACCELERATOR: cpu
      RKNODE_WORKER_CAPABILITIES: yolo-detect,deeplabv3plus
      RKNODE_WORKER_MAX_CONCURRENCY: "1"
      RKNODE_WORK_DIR: /data/jobs
    volumes:
      - trainer-data:/data
    logging: *rknode-logging

volumes:
  trainer-data:
