services:
  trainer:
    build:
      dockerfile: deploy/Dockerfile.trainer-paddle
      args:
        BASE_IMAGE: python:3.11-slim-bookworm
        DEBIAN_MIRROR: http://deb.debian.org
        PADDLE_PACKAGE: paddlepaddle-gpu==3.2.2
        PADDLE_INDEX_URL: https://www.paddlepaddle.org.cn/packages/stable/cu126/
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-trainer-paddle-cuda12.6:2026.08.20
    environment:
      RKNODE_ENDPOINT_ID: replace-with-paddle-cuda-endpoint-id
      RKNODE_NODE_NAME: cuda-paddle-trainer-01
      RKNODE_NODE_ACCELERATOR: cuda
      RKNODE_NODE_CAPABILITIES: ppocr-det,ppocr-rec
      RKNODE_WORKER_NAME: cuda-paddle-trainer-01
      RKNODE_WORKER_ACCELERATOR: cuda
      RKNODE_WORKER_CAPABILITIES: ppocr-det,ppocr-rec
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
