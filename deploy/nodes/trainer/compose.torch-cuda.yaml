services:
  trainer:
    build:
      dockerfile: deploy/Dockerfile.trainer-torch
      args:
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
        DEBIAN_MIRROR: http://deb.debian.org
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
        TORCH_VERSION: 2.5.1+cu124
        TORCHVISION_VERSION: 0.20.1+cu124
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-trainer-torch-cuda12.4:2026.08.24
    environment:
      RKNODE_ENDPOINT_ID: replace-with-torch-cuda-endpoint-id
      RKNODE_NODE_NAME: cuda-torch-trainer-01
      RKNODE_NODE_ACCELERATOR: cuda
      RKNODE_NODE_CAPABILITIES: yolo-detect,deeplabv3plus
      RKNODE_WORKER_NAME: cuda-torch-trainer-01
      RKNODE_WORKER_ACCELERATOR: cuda
      RKNODE_WORKER_CAPABILITIES: yolo-detect,deeplabv3plus
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
