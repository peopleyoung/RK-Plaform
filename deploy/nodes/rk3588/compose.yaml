# Compose-only RK3588 deployment. Converter and inference use separate endpoint IDs and volumes.
x-rknode-logging: &rknode-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-rknode-build: &rknode-build
  context: ../../..
  dockerfile: deploy/rk3588/Dockerfile.node
  target: rknode-runtime
  args:
    RKNN_TOOLKIT_IMAGE: rknn_toolkit2:2.3.2-debian12-cp311-aarch64
    DEBIAN_MIRROR: http://deb.debian.org
    PYTHON_INDEX_URL: https://pypi.org/simple

services:
  converter:
    build: *rknode-build
    image: rknode-rk3588-node:2026.08.26-business
    restart: unless-stopped
    ports:
      - "10081:10081"
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
    environment:
      RKNODE_NODE_TOKEN: ""
      RKNODE_NODE_TOKEN_FILE: /data/state/node-token
      RKNODE_ENDPOINT_ID: service_5918689191d54b75ade96d21375d5872
      RKNODE_PLATFORM_URL: http://172.16.66.249:5173
      RKNODE_NODE_NAME: rk3588-converter-01
      RKNODE_NODE_KIND: converter
      RKNODE_NODE_ACCELERATOR: rk3588
      RKNODE_NODE_CAPABILITIES: yolo-detect,deeplabv3plus,ppocr-det,ppocr-rec
      RKNODE_NODE_PORT: "10081"
      RKNODE_NODE_WORK_DIR: /data/jobs
      RKNODE_REQUIRE_NPU_DEVICE: "true"
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_WORKER_NAME: rk3588-converter-01
      RKNODE_WORKER_KIND: converter
      RKNODE_WORKER_ACCELERATOR: rk3588
      RKNODE_WORKER_CAPABILITIES: yolo-detect,deeplabv3plus,ppocr-det,ppocr-rec
      RKNODE_WORK_DIR: /data/jobs
    volumes:
      - converter-data:/data
    logging: *rknode-logging

  inference:
    build: *rknode-build
    image: rknode-rk3588-node:2026.08.26-business
    init: true
    restart: unless-stopped
    ports:
      - "10082:10081"
    security_opt:
      - systempaths=unconfined
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    environment:
      RKNODE_NODE_TOKEN: ""
      RKNODE_NODE_TOKEN_FILE: /data/state/node-token
      RKNODE_ENDPOINT_ID: service_7a6d0eaba81c4cf9be13f60b223e2f7d
      RKNODE_PLATFORM_URL: http://172.16.66.249:5173
      RKNODE_NODE_NAME: rk3588-inference-01
      RKNODE_NODE_KIND: inference
      RKNODE_NODE_ACCELERATOR: rk3588
      RKNODE_NODE_CAPABILITIES: yolo_dfl_split_v1,deeplab_logits_v1,ppocr_db_det_v1,ppocr_ctc_rec_v1
      RKNODE_NODE_FEATURES: rkmpp_decode,bytetrack,kafka,zlm_sei,analytics_area,analytics_line,event_snapshot,event_record,secondary_infer
      RKNODE_NODE_MAX_CONCURRENCY: "4"
      RKNODE_NODE_PORT: "10081"
      RKNODE_HARDWARE_ID: rk3588-direct-01
      RKNODE_RUNTIME_VERSION: rknn-runtime-2.3.2
      RKNODE_DRIVER_VERSION: rknpu-0.9.8
      RKNODE_PIPELINE_VERSION: rknode-cpp-runtime-2026.08.26-business
      RKNODE_ADAPTERS: yolo_dfl_split_v1,deeplab_logits_v1,ppocr_db_det_v1,ppocr_ctc_rec_v1
      RKNODE_MODEL_DIR: /data/models
      RKNODE_STATE_DIR: /data/state
      RKNODE_RUNTIME_STATE_DIR: /data/runtime
      RKNODE_INFERENCE_OUTPUT_DIR: /data/output
      RKNODE_REQUIRE_NPU_DEVICE: "true"
      RKNODE_RUNTIME_COMMAND: /opt/rknode/runtime-adapter/activate-task.sh
      RKNODE_RUNTIME_HEALTH_COMMAND: /opt/rknode/runtime-adapter/health.sh
      RKNODE_MODEL_PROBE_COMMAND: /opt/rknode/runtime-adapter/probe-model.sh
      RKNODE_SELF_TEST_COMMAND: /opt/rknode/runtime-adapter/self-test.sh
    volumes:
      - inference-data:/data
      - ./output:/data/output
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro
    logging: *rknode-logging

volumes:
  converter-data:
  inference-data:
