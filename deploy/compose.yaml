# Compose-only deployment. Edit the values marked "replace-with" before production use.
x-rknode-platform-config:
  admin-token: &admin-token admin
  worker-token: &worker-token replace-with-a-long-random-worker-token
  zlm-api-secret: &zlm-api-secret replace-with-zlm-api-secret
  zlm-hook-identity: &zlm-hook-identity replace-with-zlm-hook-identity

x-rknode-logging: &rknode-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: rknode-platform-api:2026.08.25
    restart: unless-stopped
    environment:
      RKNODE_ENVIRONMENT: production
      RKNODE_DATA_DIR: /data
      RKNODE_ADMIN_TOKEN: *admin-token
      RKNODE_WORKER_TOKEN: *worker-token
      RKNODE_PUBLIC_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_CORS_ORIGINS: http://172.16.66.249:5173
      RKNODE_MEDIA_BUILTIN_ENABLED: "true"
      RKNODE_MEDIA_PUBLISH_HOST: 172.16.66.249
      RKNODE_MEDIA_PLAYBACK_HOST: 172.16.66.249
      RKNODE_MEDIA_RTSP_PORT: "8554"
      RKNODE_MEDIA_WS_PORT: "8081"
      RKNODE_MEDIA_API_HOST: media
      RKNODE_MEDIA_API_PORT: "80"
      RKNODE_ZLM_API_SECRET: *zlm-api-secret
      RKNODE_ZLM_HOOK_IDENTITY: *zlm-hook-identity
    volumes:
      - platform-data:/data
    logging: *rknode-logging
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: rknode-platform-web:2026.08.25
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    logging: *rknode-logging

  media:
    build:
      context: ..
      dockerfile: deploy/media/Dockerfile
      args:
        ZLM_BASE_IMAGE: zlmediakit/zlmediakit@sha256:a9cb0166409bdd8f473162eb2fcb12d15206f98daeeeec36606072e5a352af15
    image: rknode-platform-media:2026.08.24
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RKNODE_ZLM_API_SECRET: *zlm-api-secret
      RKNODE_ZLM_HOOK_IDENTITY: *zlm-hook-identity
    ports:
      - "8554:554"
      - "8081:80"
    volumes:
      - media-data:/opt/media/www
      - media-logs:/opt/media/bin/log
    logging: *rknode-logging
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,urllib.request; urllib.request.urlopen(\"http://127.0.0.1/index/api/getServerConfig?secret=\" + os.environ[\"RKNODE_ZLM_API_SECRET\"], timeout=3)' "]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  platform-data:
  media-data:
  media-logs:
