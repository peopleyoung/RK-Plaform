# Legacy pull Worker/Agent deployment. New deployments use deploy/nodes/rk3588.
services:
  converter:
    build:
      context: ../..
      dockerfile: deploy/rk3588/Dockerfile.node
      target: rknode-runtime
      args:
        RKNN_TOOLKIT_IMAGE: rknn_toolkit2:2.3.2-debian12-cp311-aarch64
        DEBIAN_MIRROR: http://deb.debian.org
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-rk3588-node:2026.08.25-business
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
    working_dir: /opt/rknode
    command: ["python3", "-m", "workers.converter.main"]
    environment:
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_WORKER_TOKEN: replace-with-legacy-worker-token
      RKNODE_WORKER_NAME: rk3588-converter-01
      RKNODE_WORKER_KIND: converter
      RKNODE_WORKER_ACCELERATOR: rk3588
      RKNODE_WORKER_CAPABILITIES: yolo-detect,deeplabv3plus,ppocr-det,ppocr-rec
      RKNODE_WORKER_VERSION: rknn-toolkit2-2.3.2
      RKNODE_WORK_DIR: /data/jobs
      RKNODE_LEASE_RENEW_SECONDS: "30"
      RKNODE_WORKSPACE_RECONCILE_SECONDS: "30"
    volumes:
      - converter-data:/data

  inference-agent:
    build:
      context: ../..
      dockerfile: deploy/rk3588/Dockerfile.node
      target: rknode-runtime
      args:
        RKNN_TOOLKIT_IMAGE: rknn_toolkit2:2.3.2-debian12-cp311-aarch64
        DEBIAN_MIRROR: http://deb.debian.org
        PYTHON_INDEX_URL: https://pypi.org/simple
    image: rknode-rk3588-node:2026.08.25-business
    init: true
    restart: unless-stopped
    network_mode: host
    security_opt:
      - systempaths=unconfined
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    working_dir: /opt/rknode
    command: ["python3", "-m", "workers.inference_agent.main"]
    environment:
      RKNODE_API_URL: http://172.16.66.249:5173/api/v1
      RKNODE_NODE_ID: replace-with-legacy-inference-node-id
      RKNODE_REGISTRATION_TOKEN: replace-with-one-time-registration-token
      RKNODE_HARDWARE_ID: rk3588-board-01
      RKNODE_RUNTIME_VERSION: rknn-runtime-2.3.2
      RKNODE_DRIVER_VERSION: unknown
      RKNODE_PIPELINE_VERSION: rknode-cpp-runtime-2026.08.25-business
      RKNODE_ADAPTERS: yolo_dfl_split_v1,deeplab_logits_v1,ppocr_db_det_v1,ppocr_ctc_rec_v1
      RKNODE_MEDIA_FEATURES: rkmpp_decode,bytetrack,kafka,zlm_sei,analytics_area,analytics_line,event_snapshot,event_record,secondary_infer
      RKNODE_MODEL_DIR: /data/models
      RKNODE_STATE_DIR: /data/state
      RKNODE_STAGING_ONLY: "false"
      RKNODE_SELF_TEST_COMMAND: /opt/rknode/runtime-adapter/self-test.sh
      RKNODE_MODEL_PROBE_COMMAND: /opt/rknode/runtime-adapter/probe-model.sh
      RKNODE_RUNTIME_COMMAND: /opt/rknode/runtime-adapter/activate-task.sh
      RKNODE_RUNTIME_HEALTH_COMMAND: /opt/rknode/runtime-adapter/health.sh
      RKNODE_RUNTIME_TIMEOUT_SECONDS: "120"
      RKNODE_POLL_SECONDS: "3"
      RKNODE_RUNTIME_STATE_DIR: /data/runtime
      RKNODE_INFERENCE_OUTPUT_DIR: /data/output
      RKNODE_REQUIRE_NPU_DEVICE: "true"
      RKNODE_AUTO_RECOVER: "true"
      RKNODE_RESULT_SINK_TOKEN: ""
    volumes:
      - inference-models:/data
      - ./output:/data/output
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro

volumes:
  converter-data:
  inference-models:
