# Legacy CUDA overlay.
services:
  torch-trainer:
    image: rknode-trainer-torch-cuda12.4:2026.08.26
    build:
      args:
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
    environment:
      RKNODE_WORKER_ACCELERATOR: cuda
      RKNODE_WORKER_NAME: cuda-torch-trainer-01
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  paddle-trainer:
    image: rknode-trainer-paddle-cuda12.6:2026.08.26
    build:
      args:
        BASE_IMAGE: python:3.11-slim-bookworm
        PADDLE_INDEX_URL: https://www.paddlepaddle.org.cn/packages/stable/cu126/
    environment:
      RKNODE_WORKER_ACCELERATOR: cuda
      RKNODE_WORKER_NAME: cuda-paddle-trainer-01
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
