[protocol]
add_mute_audio=0
auto_close=0
continue_push_ms=15000
enable_audio=0
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_rtsp=1
enable_rtmp=1
enable_ts=0
enable_fmp4=0

[api]
apiDebug=0
secret=${RKNODE_ZLM_API_SECRET}

[general]
enableVhost=0
listen_ip=::
mediaServerId=${RKNODE_ZLM_HOOK_IDENTITY}
mergeWriteMS=0
streamNoneReaderDelayMS=3000

[hook]
enable=1
alive_interval=1
timeoutSec=3
retry=1
retry_delay=1
on_flow_report=
on_http_access=
on_play=http://host.docker.internal:${RKNODE_MEDIA_FIXTURE_API_PORT}/api/v1/media-hooks/zlm/gateway_builtin/on-play
on_publish=http://host.docker.internal:${RKNODE_MEDIA_FIXTURE_API_PORT}/api/v1/media-hooks/zlm/gateway_builtin/on-publish
on_record_mp4=
on_record_ts=
on_rtp_server_timeout=
on_rtsp_auth=
on_rtsp_realm=
on_send_rtp_stopped=
on_server_exited=
on_server_keepalive=http://host.docker.internal:${RKNODE_MEDIA_FIXTURE_API_PORT}/api/v1/media-hooks/zlm/gateway_builtin/on-server-keepalive
on_server_started=
on_shell_login=
on_stream_changed=
on_stream_none_reader=
on_stream_not_found=

[http]
allow_cross_domains=1
charSet=utf-8
dirMenu=0
keepAliveSecond=15
maxReqSize=40960
port=80
rootPath=./www
sendBufSize=65536
sslport=0

[rtmp]
enhanced=0
handshakeSecond=15
keepAliveSecond=15
port=1935
sslport=0

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
lowLatency=1
port=554
sslport=0

[shell]
maxReqSize=1024
port=0
