services:
  media:
    image: ${RKNODE_ZLM_CANDIDATE_IMAGE:?set immutable candidate image}
    pull_policy: never
    entrypoint: []
    working_dir: /opt/media/bin
    command: ["./MediaServer", "-s", "default.pem", "-c", "/fixture/config.ini", "-l", "0"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${RKNODE_MEDIA_FIXTURE_RTSP_PORT:?set RTSP port}:554"
      - "127.0.0.1:${RKNODE_MEDIA_FIXTURE_HTTP_PORT:?set HTTP port}:80"
    volumes:
      - "${RKNODE_MEDIA_FIXTURE_CONFIG:?set rendered config}:/fixture/config.ini:ro"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,urllib.request; urllib.request.urlopen(\"http://127.0.0.1/index/api/getServerConfig?secret=\" + os.environ[\"RKNODE_ZLM_API_SECRET\"], timeout=2)' "]
      interval: 1s
      timeout: 2s
      retries: 30
